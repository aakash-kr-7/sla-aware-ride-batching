<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Ride batching architecture</title>
<desc id="desc">The browser and HTTP clients call a Spring Boot application. Booking, planning, dispatch and execution share transactional state in PostgreSQL. Only active pickup zones are cached in Caffeine.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536762"/></marker></defs>
<rect width="760" height="500" fill="#f5f6f4"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#192e2b">
<text x="28" y="40" font-size="23" font-weight="700">From request to shared trip</text>
<rect x="28" y="65" width="704" height="60" rx="6" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="91" font-size="18" font-weight="600">Request console / Swagger / HTTP client</text>
<text x="48" y="114" font-size="15" fill="#536762">JSON requests with JWT authentication and employee ownership checks</text>
<path d="M380 126V158" stroke="#536762" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="164" width="704" height="200" rx="6" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="194" font-size="18" font-weight="700">Spring Boot application</text>
<path d="M48 210H712" stroke="#d5ded9"/>
<text x="48" y="239" font-size="18" font-weight="600">Booking</text>
<text x="48" y="267" font-size="15">Zone validation</text><text x="48" y="291" font-size="15">Deduplication</text><text x="48" y="315" font-size="15">Late insertion / cancel</text>
<text x="278" y="239" font-size="18" font-weight="600">Planning</text>
<text x="278" y="267" font-size="15">Window / zone / direction</text><text x="278" y="291" font-size="15">Capacity / SLA / detour</text><text x="278" y="315" font-size="15">Routes and initial offers</text>
<text x="512" y="239" font-size="18" font-weight="600">Dispatch &amp; execution</text>
<text x="512" y="267" font-size="15">Reject / next driver</text><text x="512" y="291" font-size="15">Accept under row locks</text><text x="512" y="315" font-size="15">Ordered pickup / dropoff</text>
<text x="48" y="345" font-size="14" fill="#536762">Local travel-time estimator: distance, fixed speed and stop dwell</text>
<path d="M270 365V397" stroke="#536762" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 365V397" stroke="#536762" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="404" width="465" height="70" rx="6" fill="#e4eee7" stroke="#b9c9bf"/>
<rect x="516" y="404" width="216" height="70" rx="6" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="432" font-size="18" font-weight="600">PostgreSQL + Flyway</text><text x="48" y="459" font-size="15">Durable records, constraints and atomic commits</text>
<text x="536" y="432" font-size="18" font-weight="600">Caffeine</text><text x="536" y="459" font-size="15">Active zones only</text>
</g></svg>
