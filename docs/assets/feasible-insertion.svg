<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Search for the cheapest feasible route</title><desc id="desc">In FeasibleInsertionRegressionTest, a 222-second insertion picks up B at 111 seconds and misses B's 50-second deadline. A 333-second insertion picks up B immediately and A at 111 seconds, within A's 120-second deadline.</desc>
<rect width="760" height="390" fill="#f5f6f4"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#192e2b">
<text x="28" y="40" font-size="23" font-weight="700">The shortest insertion can miss a deadline</text><text x="28" y="69" font-size="16" fill="#536762">A: pickup by +120 s. B: pickup by +50 s.</text>
<rect x="28" y="95" width="704" height="106" rx="6" fill="#fff4eb" stroke="#d9bda4"/>
<text x="48" y="125" font-size="18" font-weight="600">222 s total · rejected</text>
<path d="M70 151H680" stroke="#a66c25" stroke-width="2"/>
<g fill="#a66c25"><circle cx="70" cy="151" r="5"/><circle cx="275" cy="151" r="5"/><circle cx="480" cy="151" r="5"/><circle cx="680" cy="151" r="5"/></g>
<text x="48" y="182" font-size="15">A pickup +0 s</text><text x="211" y="182" font-size="15" fill="#8c451b">B pickup +111 s</text><text x="444" y="182" font-size="15">B dropoff</text><text x="643" y="182" font-size="15">A dropoff</text>
<rect x="28" y="218" width="704" height="106" rx="6" fill="#e4eee7" stroke="#b9c9bf"/>
<text x="48" y="248" font-size="18" font-weight="600">333 s total · feasible</text>
<path d="M70 274H680" stroke="#196b55" stroke-width="2"/>
<g fill="#196b55"><circle cx="70" cy="274" r="5"/><circle cx="275" cy="274" r="5"/><circle cx="480" cy="274" r="5"/><circle cx="680" cy="274" r="5"/></g>
<text x="48" y="305" font-size="15">B pickup +0 s</text><text x="211" y="305" font-size="15">A pickup +111 s</text><text x="444" y="305" font-size="15">B dropoff</text><text x="643" y="305" font-size="15">A dropoff</text>
<text x="28" y="353" font-size="14" fill="#536762">Regression-test illustration; stop spacing is schematic, not elapsed time.</text><text x="28" y="376" font-size="14" fill="#536762">Test: 36 km/h, circuity 1, no dwell, 300% relative detour. Runtime defaults differ.</text>
</g></svg>