<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Cheapest route versus cheapest feasible route</title>
  <desc id="desc">Regression-test illustration. The 222-second route picks up B at 111 seconds, after B's 50-second deadline. The 333-second route picks up B immediately and A at 111 seconds, before A's 120-second deadline. The test uses its own estimator and generous detour settings.</desc>
  <rect width="1120" height="460" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">A slightly longer route can be the valid route.</text>
    <text x="40" y="78" font-size="15" fill="#475569">Regression fixture: A must be picked up by +120 s; B by +50 s.</text>
    <rect x="40" y="108" width="1040" height="121" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="60" y="140" font-size="18" font-weight="700" fill="#9a3412">Cheapest insertion · total 222 s · rejected</text>
    <path d="M86 177 H980" stroke="#fdba74" stroke-width="3"/>
    <g fill="#9a3412"><circle cx="86" cy="177" r="6"/><circle cx="395" cy="177" r="6"/><circle cx="705" cy="177" r="6"/><circle cx="980" cy="177" r="6"/></g>
    <text x="60" y="207" font-size="14" fill="#334155">A pickup +0</text>
    <text x="326" y="207" font-size="14" font-weight="700" fill="#9a3412">B pickup +111: late</text>
    <text x="664" y="207" font-size="14" fill="#334155">B dropoff</text>
    <text x="922" y="207" font-size="14" fill="#334155">A dropoff</text>
    <rect x="40" y="249" width="1040" height="121" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="60" y="281" font-size="18" font-weight="700" fill="#065f46">Cheapest feasible insertion · total 333 s · accepted</text>
    <path d="M86 318 H980" stroke="#6ee7b7" stroke-width="3"/>
    <g fill="#065f46"><circle cx="86" cy="318" r="6"/><circle cx="395" cy="318" r="6"/><circle cx="705" cy="318" r="6"/><circle cx="980" cy="318" r="6"/></g>
    <text x="60" y="348" font-size="14" fill="#334155">B pickup +0</text>
    <text x="321" y="348" font-size="14" font-weight="700" fill="#065f46">A pickup +111: on time</text>
    <text x="664" y="348" font-size="14" fill="#334155">B dropoff</text>
    <text x="922" y="348" font-size="14" fill="#334155">A dropoff</text>
    <text x="40" y="409" font-size="14" fill="#475569">Illustration, not a scaled timeline. Values come from FeasibleInsertionRegressionTest.</text>
    <text x="40" y="434" font-size="14" fill="#475569">Test settings: circuity 1, speed 36 km/h, dwell 0, relative detour 300%; runtime defaults differ.</text>
  </g>
</svg>
