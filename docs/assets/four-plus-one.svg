<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Five riders, two trips</title><desc id="desc">In the long-journey fixture, four riders share a trip and the fifth takes a separate trip. Carrying five at once exceeds four seats. Dropping someone before returning fits the seats but misses a pickup deadline. Illustrative grouping, not captured API data.</desc>
<rect width="760" height="470" fill="#f5f6f4"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#192e2b">
<text x="28" y="40" font-size="23" font-weight="700">Five riders, two trips</text><text x="28" y="69" font-size="16" fill="#536762">Same pickup and long journey. Four seats. Twenty minutes to pickup.</text>
<rect x="28" y="96" width="444" height="124" rx="6" fill="#e4eee7" stroke="#b9c9bf"/><rect x="494" y="96" width="238" height="124" rx="6" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="126" font-size="18" font-weight="600">Shared trip</text><text x="514" y="126" font-size="18" font-weight="600">Separate trip</text>
<g fill="#196b55"><rect x="48" y="143" width="84" height="42" rx="4"/><rect x="148" y="143" width="84" height="42" rx="4"/><rect x="248" y="143" width="84" height="42" rx="4"/><rect x="348" y="143" width="84" height="42" rx="4"/><rect x="514" y="143" width="84" height="42" rx="4"/></g>
<g fill="#fff" text-anchor="middle" font-size="17"><text x="90" y="170">A</text><text x="190" y="170">B</text><text x="290" y="170">C</text><text x="390" y="170">D</text><text x="556" y="170">E</text></g>
<text x="48" y="208" font-size="15">Peak occupancy: 4</text><text x="514" y="208" font-size="15">Peak occupancy: 1</text>
<text x="28" y="261" font-size="18" font-weight="600">Why the fifth rider cannot join this route</text>
<rect x="28" y="279" width="704" height="60" rx="4" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="303" font-size="16" font-weight="600">Pick everyone up first</text><text x="48" y="327" font-size="15">Five riders onboard exceeds capacity.</text><text x="580" y="316" font-size="15" fill="#9c581c">CAPACITY</text>
<rect x="28" y="352" width="704" height="60" rx="4" fill="#fff" stroke="#b9c9bf"/>
<text x="48" y="376" font-size="16" font-weight="600">Drop someone off, then return</text><text x="48" y="400" font-size="15">A seat is free, but the next pickup is too late.</text><text x="580" y="389" font-size="15" fill="#9c581c">PICKUP_SLA</text>
<text x="28" y="449" font-size="14" fill="#536762">Illustrative grouping. Short journeys can allow seat turnover and different results.</text>
</g></svg>