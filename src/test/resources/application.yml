# Test environment configuration
# Strictly uses PostgreSQL (via Testcontainers @ServiceConnection). H2 is not on the classpath and is never used.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  batching:
    window-duration-minutes: 15
    max-bearing-angle-diff-degrees: 45
  sla:
    pickup-sla-minutes: 20
  geo:
    dedup-coordinate-precision: 4
