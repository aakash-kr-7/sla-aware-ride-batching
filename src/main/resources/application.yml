spring:
  application:
    name: sla-aware-ride-batching
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ride_batching}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  batching:
    window-duration-minutes: 15
    max-bearing-angle-diff-degrees: 45
  sla:
    pickup-sla-minutes: 20
  geo:
    dedup-coordinate-precision: 4
