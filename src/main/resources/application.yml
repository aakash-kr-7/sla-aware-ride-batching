spring:
  application:
    name: sla-aware-ride-batching
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ride_batching}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 3600000
  batching:
    window-duration-minutes: 15
    max-bookings-per-cycle: 100
    urgent-lead-time-seconds: 300
    max-bearing-angle-diff-degrees: 45
    max-relative-detour-ratio: 1.0
    max-absolute-detour-minutes: 30
    scheduling:
      enabled: false
      interval-ms: 5000
  fleet:
    default-vehicle-capacity: 4
  sla:
    pickup-sla-minutes: 20
  geo:
    circuity-factor: 1.35
    average-speed-kmh: 30.0
    stop-dwell-time-seconds: 120

dispatch:
  offer-lifetime: PT2M
  max-offers-per-trip: 3
  cool-off:
    duration: PT5M
