# Local development profile
app:
  local:
    admin:
      enabled: ${LOCAL_ADMIN_ENABLED:false}
      username: ${LOCAL_ADMIN_USERNAME:}
      password: ${LOCAL_ADMIN_PASSWORD:}

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ridebatching: DEBUG
    org.flywaydb: INFO
