name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify with Maven
        run: ./mvnw --batch-mode clean verify

      - name: Verify the reviewer demo
        run: |
          python3 scripts/demo/demo.py reset
          python3 scripts/demo/demo.py run
